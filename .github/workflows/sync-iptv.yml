name: Sync IPTV Source

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest IPTV source
        run: |
          curl -L "http://192168125.ddnsto.com:5000/000.txt" -o 000.txt
          curl -L "http://192168125.ddnsto.com:5000/000.m3u" -o 000.m3u

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add 000.txt
          git add 000.m3u
          git commit -m "Auto sync IPTV source at $(date)" || echo "No changes to commit"
          git push
