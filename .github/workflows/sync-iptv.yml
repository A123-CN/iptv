name: Sync IPTV Source

on:
  schedule:
    - cron: '0 13 * * *'  # UTC 13:00 = 北京时间 21:00
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Update IPTV URLs
        run: |
          set -euo pipefail
          
          echo "=== 开始更新 IPTV 源 ==="
          echo "时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          
          sed -i 's/\r$//' iptv.txt
          cp iptv.txt iptv.txt.bak
          
          > /tmp/all_urls.txt
          
          download_source() {
            local url="$1"
            local tmp_file="/tmp/source_raw_$$"
            
            if ! curl -L --fail --connect-timeout 30 --max-time 60 "$url" -o "$tmp_file" 2>/dev/null; then
              rm -f "$tmp_file"
              return 1
            fi
            
            # ✅ 核心修复：全局强制去除所有回车符和换行符残留，防止污染后续逻辑
            tr -d '\r' < "$tmp_file" > "${tmp_file}.clean"
            mv "${tmp_file}.clean" "$tmp_file"
            
            if head -n 5 "$tmp_file" | grep -qi '#EXTM3U\|#EXTINF'; then
              echo "    🔄 检测到 M3U 格式，正在转换..."
              awk '
                /^#EXTINF:/ {
                  sub(/^#EXTINF:[^,]*,/, "")
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                  gsub(/"/, "")
                  # 防止频道名内部包含异常换行，强制替换为空格
                  gsub(/\n/, " ")
                  channel = $0
                  next
                }
                /^https?:\/\// {
                  if (channel != "") {
                    print channel "," $0
                    channel = ""
                  }
                }
              ' "$tmp_file" >> /tmp/all_urls.txt
            else
              grep -E '^[^#].+,https?://' "$tmp_file" >> /tmp/all_urls.txt 2>/dev/null || true
            fi
            
            rm -f "$tmp_file"
            return 0
          }
          
          SOURCES=(
            "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hbyd"
            "https://raw.giteeusercontent.com/yuweirong6684/tv-live-streaming-source/raw/master/abc.txt"
            "https://raw.githubusercontent.com/kakaxi-1/IPTV/refs/heads/main/ipv4.txt"
            "https://raw.githubusercontent.com/YueChan/Live/refs/heads/main/GNTV.m3u"
          )
          
          for source in "${SOURCES[@]}"; do
            echo "  下载: $source"
            success=false
            for i in {1..3}; do
              if download_source "$source"; then
                echo "    ✅ 下载成功"
                success=true
                break
              else
                echo "    ⚠️ 下载失败，重试 $i/3..."
                sleep 5
              fi
            done
            if [ "$success" = false ]; then
              echo "    ❌ 该源最终下载失败，已跳过"
            fi
          done
          
          # 🛡️ 深度清洗：确保每一行都是严格的单行合法数据
          sed -i 's/^[[:space:]]*//;s/[[:space:]]*$//' /tmp/all_urls.txt
          awk -F',' 'NF>=2 && $1!="" && $2~/^https?:\/\//' /tmp/all_urls.txt | sort -u > /tmp/all_urls_clean.txt
          mv /tmp/all_urls_clean.txt /tmp/all_urls.txt
          
          total_urls=$(wc -l < /tmp/all_urls.txt)
          echo "下载完成，清洗后共获取 $total_urls 条有效记录"
          
          normalize() {
            # 增加对换行符的显式过滤
            echo "$1" | tr -d '\n\r' | sed 's/[^a-zA-Z0-9\u4e00-\u9fa5]//g' | tr 'A-Z' 'a-z'
          }
          
          declare -A source_map
          while IFS=',' read -r channel url; do
            norm_channel=$(normalize "$channel")
            if [ -z "$norm_channel" ]; then continue; fi
            if [ -z "${source_map[$norm_channel]:-}" ]; then
              source_map["$norm_channel"]="$url"
            fi
          done < /tmp/all_urls.txt
          
          check_url() {
            local url="$1"
            if echo "$url" | grep -qE '://(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|207\.56\.)'; then
              return 0
            fi
            timeout 8 ffprobe -v quiet -t 6 "$url" >/dev/null 2>&1
          }
          export -f check_url
          
          matched=0
          total=0
          > /tmp/check_tasks.txt
          
          while IFS= read -r line; do
            # ✅ 安全兜底：跳过包含换行符或空白的异常行
            if [[ -z "$line" ]] || [[ "$line" =~ [[:cntrl:]] ]]; then continue; fi
            if [[ "$line" == *"#genre#"* ]] || [[ "$line" == "#"* ]]; then continue; fi
            
            channel_name="${line%%,*}"
            norm_name=$(normalize "$channel_name")
            new_url=""
            
            if [ -n "$norm_name" ] && [ -n "${source_map[$norm_name]:-}" ]; then
              new_url="${source_map[$norm_name]}"
            else
              for src_norm in "${!source_map[@]}"; do
                if [[ "$src_norm" == "$norm_name"* ]] || [[ "$norm_name" == "$src_norm"* ]]; then
                  new_url="${source_map[$src_norm]}"
                  break
                fi
              done
            fi
            
            total=$((total + 1))
            if [ -n "$new_url" ]; then
              echo "${channel_name}|${new_url}" >> /tmp/check_tasks.txt
            else
              echo "${channel_name}|" >> /tmp/check_tasks.txt
            fi
          done < iptv.txt
          
          echo "开始并发检测 ${total} 个频道..."
          > /tmp/check_results.txt
          cat /tmp/check_tasks.txt | xargs -P 10 -I {} bash -c '
            IFS="|" read -r ch url <<< "{}"
            if [ -z "$url" ]; then
              echo "${ch}||⚠️ 未找到匹配" >> /tmp/check_results.txt
            elif check_url "$url"; then
              echo "${ch}|${url}|✅" >> /tmp/check_results.txt
            else
              echo "${ch}||❌ URL无效" >> /tmp/check_results.txt
            fi
          '
          
          declare -A result_map
          while IFS='|' read -r ch url status; do
            result_map["$ch"]="${url}|${status}"
          done < /tmp/check_results.txt
          
          while IFS= read -r line; do
            if [[ -z "$line" ]] || [[ "$line" =~ [[:cntrl:]] ]]; then echo "$line"; continue; fi
            if [[ "$line" == *"#genre#"* ]] || [[ "$line" == "#"* ]]; then echo "$line"; continue; fi
            
            channel_name="${line%%,*}"
            if [ -n "${result_map[$channel_name]:-}" ]; then
              IFS='|' read -r final_url status <<< "${result_map[$channel_name]}"
              echo "$channel_name,$final_url"
              if [ "$status" = "✅" ]; then matched=$((matched + 1)); fi
              echo "  $status $channel_name -> $final_url"
            else
              echo "$channel_name,"
            fi
          done < iptv.txt > iptv.txt.new
          
          new_lines=$(wc -l < iptv.txt.new)
          echo "匹配统计: $matched/$total 个频道成功匹配"
          
          if [ "$new_lines" -lt 50 ]; then
            echo "❌ 错误: 生成文件行数过少 ($new_lines)"
            cp iptv.txt.bak iptv.txt
            exit 1
          fi
          
          mv iptv.txt.new iptv.txt
          echo "✅ 更新完成"

      - name: Record log and Commit
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          MATCHED=$(grep -c ',http' iptv.txt || true)
          TOTAL=$(grep -cv '^#\|^$\|#genre#' iptv.txt || true)
          
          echo "${TIMESTAMP} | ✅ 同步成功 | 有效:${MATCHED}/${TOTAL}" >> sync.log
          tail -n 30 sync.log > sync.log.tmp && mv sync.log.tmp sync.log
          
          git add iptv.txt sync.log
          if git diff --cached --quiet; then
            echo "✅ 内容无变化，跳过提交"
            exit 0
          fi
          
          git commit -m "Update IPTV - ${TIMESTAMP} (有效:${MATCHED}/${TOTAL})"
          git pull --rebase --strategy-option ours
          git push
          echo "✅ 已成功推送到仓库"
