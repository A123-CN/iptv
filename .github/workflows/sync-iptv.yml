name: Sync IPTV Source

on:
  schedule:
    - cron: '0 13 * * *'  # UTC 13:00 = 北京时间 21:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Update IPTV URLs
        run: |
          set -euo pipefail  # 严格模式，任何错误都会终止
          
          echo "=== 开始更新 IPTV 源 ==="
          echo "时间: $(date)"
          
          # 安装 ffmpeg
          echo "安装 ffmpeg..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          
          # 转换换行符
          sed -i 's/\r$//' iptv.txt
          
          # 备份原文件
          cp iptv.txt iptv.txt.bak
          echo "原文件已备份到 iptv.txt.bak"
          
          # 下载所有源并提取有效URL
          echo "下载并解析各源..."
          
          > /tmp/all_urls.txt
          
          # 定义源列表
          SOURCES=(
            "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hbyd"
            "https://raw.giteeusercontent.com/yuweirong6684/tv-live-streaming-source/raw/master/abc.txt"
            "https://raw.githubusercontent.com/kakaxi-1/IPTV/refs/heads/main/ipv4.txt"
            "https://raw.githubusercontent.com/YueChan/Live/refs/heads/main/GNTV.m3u"
          )
          
          for source in "${SOURCES[@]}"; do
            echo "  下载: $source"
            # 增加重试机制
            for i in {1..3}; do
              if curl -L --fail --connect-timeout 30 --max-time 60 "$source" 2>/dev/null | \
                 grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null; then
                echo "    ✅ 下载成功"
                break
              else
                echo "    ⚠️ 下载失败，重试 $i/3..."
                sleep 5
              fi
            done
          done
          
          total_urls=$(wc -l < /tmp/all_urls.txt)
          echo "下载完成，共获取 $total_urls 条记录"
          
          # URL 有效性检测函数（简化版）
          check_url() {
            local url="$1"
            # 更快的检测：只检查连接，不分析流
            timeout 10 ffprobe -v quiet -t 8 "$url" >/dev/null 2>&1
            return $?
          }
          
          # 标准化频道名函数
          normalize() {
            echo "$1" | sed 's/[^a-zA-Z0-9]//g' | tr 'A-Z' 'a-z'
          }
          
          # 先构建源频道的标准化映射
          declare -A source_map
          while IFS=',' read -r channel url; do
            norm_channel=$(normalize "$channel")
            # 如果已存在，取优先级更高的URL
            if [ -z "${source_map[$norm_channel]:-}" ]; then
              source_map["$norm_channel"]="$url"
            fi
          done < /tmp/all_urls.txt
          
          # 更新 iptv.txt
          echo "开始更新 iptv.txt..."
          matched=0
          total=0
          
          while IFS= read -r line; do
            # 保留分类标记行
            if [[ "$line" =~ #genre# ]]; then
              echo "$line"
              continue
            fi
            
            # 跳过空行和注释
            [[ -z "$line" || "$line" =~ ^# ]] && { echo "$line"; continue; }
            
            # 提取频道名
            channel_name=$(echo "$line" | sed 's/,$//')
            norm_name=$(normalize "$channel_name")
            total=$((total + 1))
            
            # 查找匹配的URL
            new_url=""
            # 精确匹配
            if [ -n "${source_map[$norm_name]:-}" ]; then
              new_url="${source_map[$norm_name]}"
            else
              # 模糊匹配
              for src_norm in "${!source_map[@]}"; do
                if [[ "$src_norm" == *"$norm_name"* ]] || [[ "$norm_name" == *"$src_norm"* ]]; then
                  new_url="${source_map[$src_norm]}"
                  break
                fi
              done
            fi
            
            if [ -n "$new_url" ]; then
              # 检测URL有效性
              if check_url "$new_url"; then
                echo "$channel_name,$new_url"
                echo "  ✅ $channel_name -> $new_url"
                matched=$((matched + 1))
              else
                echo "$channel_name,"
                echo "  ❌ $channel_name -> URL无效"
              fi
            else
              echo "$channel_name,"
              echo "  ⚠️ $channel_name -> 未找到匹配"
            fi
          done < iptv.txt > iptv.txt.new
          
          # 检查结果
          new_lines=$(wc -l < iptv.txt.new)
          echo "匹配统计: $matched/$total 个频道成功匹配"
          
          if [ "$new_lines" -lt 50 ]; then
            echo "❌ 错误: 生成文件行数过少 ($new_lines)"
            cp iptv.txt.bak iptv.txt
            exit 1
          fi
          
          # 替换原文件
          mv iptv.txt.new iptv.txt
          echo "✅ 更新完成"

      - name: Commit and Push
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add iptv.txt
          
          if git diff --cached --quiet; then
            echo "✅ 内容无变化，跳过提交"
            exit 0
          fi
          
          git commit -m "Update IPTV URLs - $(date '+%Y-%m-%d %H:%M:%S')"
          git pull --rebase --strategy-option ours
          git push
          echo "✅ 已成功推送到仓库"
