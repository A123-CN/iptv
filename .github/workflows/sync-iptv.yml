name: Sync IPTV Source

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update IPTV URLs
        run: |
          echo "=== 开始更新 IPTV 源 ==="
          echo "时间: $(date)"
          
          # 转换换行符
          sed -i 's/\r$//' iptv.txt
          
          # 备份原文件
          if [ -f iptv.txt ]; then
            cp iptv.txt iptv.txt.bak
            echo "原文件已备份"
          fi
          
          # 下载所有源并提取有效URL
          echo "下载并解析各源..."
          
          > /tmp/all_urls.txt
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hubeiyidong" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hbyd" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hubeiyd" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.githubusercontent.com/CCSH/IPTV/refs/heads/main/live.txt" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.githubusercontent.com/CCSH/IPTV/refs/heads/main/live_lite.txt" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          echo "下载完成，共获取 $(wc -l < /tmp/all_urls.txt) 条记录"
          
          # 标准化频道名函数（去除短横线、空格、转为小写）
          normalize() {
            echo "$1" | sed 's/-//g' | sed 's/ //g' | tr 'A-Z' 'a-z'
          }
          
          # 构建频道->URL映射（按优先级）
          > /tmp/url_map.txt
          
          # 先提取模板中的所有频道名
          grep -v '#genre#' iptv.txt | grep -v '^$' | sed 's/,$//' | while read template_channel; do
            [ -z "$template_channel" ] && continue
            
            template_norm=$(normalize "$template_channel")
            
            # 在源文件中查找匹配的URL
            best_url=""
            best_priority=99
            
            while IFS=',' read -r source_channel source_url; do
              source_norm=$(normalize "$source_channel")
              
              # 模糊匹配：标准化后相等 或 包含关系
              if [ "$template_norm" = "$source_norm" ] || \
                 echo "$source_norm" | grep -q "$template_norm" || \
                 echo "$template_norm" | grep -q "$source_norm"; then
                
                # 确定优先级
                priority=99
                if echo "$source_url" | grep -q '^http://'; then
                  priority=1
                elif echo "$source_url" | grep -q '^https://'; then
                  priority=2
                elif echo "$source_url" | grep -q '^rtsp://'; then
                  priority=3
                fi
                
                if [ $priority -lt $best_priority ]; then
                  best_priority=$priority
                  best_url="$source_url"
                fi
              fi
            done < /tmp/all_urls.txt
            
            if [ -n "$best_url" ]; then
              echo "$template_channel,$best_url" >> /tmp/url_map.txt
              echo "  ✅ 匹配: $template_channel -> $best_url"
            else
              echo "  ⚠️ 未找到: $template_channel"
            fi
          done
          
          MATCH_COUNT=$(wc -l < /tmp/url_map.txt)
          echo "匹配完成，共匹配 $MATCH_COUNT 个频道"
          
          # 更新 iptv.txt
          echo "开始更新 iptv.txt..."
          > iptv.txt.new
          
          while IFS= read -r line; do
            if echo "$line" | grep -q '#genre#'; then
              echo "$line" >> iptv.txt.new
              continue
            fi
            
            if echo "$line" | grep -q '^[^#].\+,$'; then
              channel_name=$(echo "$line" | sed 's/,$//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              
              url=$(grep "^$channel_name," /tmp/url_map.txt | head -1 | cut -d',' -f2-)
              
              if [ -n "$url" ]; then
                echo "$channel_name,$url" >> iptv.txt.new
              else
                echo "$channel_name," >> iptv.txt.new
              fi
              continue
            fi
            
            echo "$line" >> iptv.txt.new
          done < iptv.txt
          
          NEW_LINES=$(wc -l < iptv.txt.new)
          if [ "$NEW_LINES" -lt 50 ]; then
            echo "❌ 错误: 生成文件行数过少 ($NEW_LINES)"
            exit 1
          fi
          
          mv iptv.txt.new iptv.txt
          echo "✅ 更新完成"

      - name: Commit and Push
        run: |
          if [ -f iptv.txt.bak ] && diff -q iptv.txt iptv.txt.bak > /dev/null; then
            echo "✅ 内容无变化，跳过提交"
            exit 0
          fi
          
          echo "🔄 检测到变化，准备提交"
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add iptv.txt
          git commit -m "Update IPTV URLs - $(date '+%Y-%m-%d %H:%M:%S')"
          
          git pull --rebase --strategy-option ours
          git push
          
          echo "✅ 已成功推送到仓库"
