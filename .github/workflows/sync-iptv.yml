name: Sync IPTV Source

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and Merge IPTV
        run: |
          > iptv.txt
          curl -L "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hubeiyidong" >> iptv.txt
          curl -L "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hbyd" >> iptv.txt
          curl -L "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hubeiyd" >> iptv.txt

      - name: Commit and Push IPTV
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add iptv.txt
          git commit -m "Update IPTV sources" || true
          git pull --rebase --strategy-option ours
          git push

      - name: Download TV
        run: |
          curl -L "http://192168125.ddnsto.com:5000/tv.txt" -o tv.txt

      - name: Commit and Push TV
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add tv.txt
          git commit -m "Update TV source" || true
          git pull --rebase --strategy-option ours
          git push
