name: Sync IPTV Source

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update IPTV URLs
        run: |
          echo "=== 开始更新 IPTV 源 ==="
          echo "时间: $(date)"
          sed -i 's/\r$//' iptv.txt
          
          # 备份原文件
          if [ -f iptv.txt ]; then
            cp iptv.txt iptv.txt.bak
            echo "原文件已备份"
          fi
          
          # 安装繁简转换工具
          sudo apt-get update
          sudo apt-get install -y opencc
          
          # 繁转简函数
          tradition_to_simple() {
            echo "$1" | opencc -c t2s 2>/dev/null || echo "$1"
          }
          
          # 下载所有源并提取有效URL
          echo "下载并解析各源..."
          
          > /tmp/all_urls.txt
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hubeiyidong" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hbyd" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hubeiyd" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.githubusercontent.com/CCSH/IPTV/refs/heads/main/live.txt" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          curl -L --fail --connect-timeout 30 --max-time 60 \
            "https://raw.githubusercontent.com/CCSH/IPTV/refs/heads/main/live_lite.txt" 2>/dev/null | \
            grep -E '^[^#].+,' >> /tmp/all_urls.txt 2>/dev/null || true
          
          echo "下载完成，共获取 $(wc -l < /tmp/all_urls.txt) 条记录"
          
          # 构建频道->URL映射
          > /tmp/url_map_raw.txt
          
          while IFS=',' read -r channel url; do
            channel=$(echo "$channel" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            url=$(echo "$url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            
            if [ -z "$channel" ] || [ -z "$url" ]; then
              continue
            fi
            
            # 协议优先级: http=1, https=2, rtsp=3
            priority=99
            if echo "$url" | grep -q '^http://'; then
              priority=1
            elif echo "$url" | grep -q '^https://'; then
              priority=2
            elif echo "$url" | grep -q '^rtsp://'; then
              priority=3
            fi
            
            channel_simple=$(tradition_to_simple "$channel")
            echo "$channel|$channel_simple|$url|$priority" >> /tmp/url_map_raw.txt
          done < /tmp/all_urls.txt
          
          echo "原始记录处理完成，共 $(wc -l < /tmp/url_map_raw.txt) 条有效记录"
          
          # 模糊匹配函数
          fuzzy_match() {
            local template="$1"
            local candidate="$2"
            
            if [ "$template" = "$candidate" ]; then
              return 0
            fi
            
            if echo "$candidate" | grep -q "$template"; then
              return 0
            fi
            
            if echo "$template" | grep -q "$candidate"; then
              return 0
            fi
            
            local clean_candidate=$(echo "$candidate" | sed 's/[Hh][Dd]//g;s/高清//g;s/超清//g;s/[0-9]//g;s/[pP]//g;s/[Ff][Hh][Dd]//g;s/4K//g;s/ //g')
            local clean_template=$(echo "$template" | sed 's/[Hh][Dd]//g;s/高清//g;s/超清//g;s/[0-9]//g;s/[pP]//g;s/[Ff][Hh][Dd]//g;s/4K//g;s/ //g')
            
            if [ "$clean_template" = "$clean_candidate" ]; then
              return 0
            fi
            
            return 1
          }
          
          # 调试：查看模板内容
          echo "=== 模板文件前20行 ==="
          head -20 iptv.txt
          
          echo "=== 提取的频道名 ==="
          # 提取模板中的频道名（不以#开头的行，且以逗号结尾）
          grep -v '^#' iptv.txt | grep ',$' | while read line; do
            channel=$(echo "$line" | sed 's/,$//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -n "$channel" ]; then
              echo "频道: [$channel]"
            fi
          done
          
          # 为每个模板频道选择最佳匹配
          > /tmp/url_map.txt
          
          grep -v '^#' iptv.txt | grep ',$' | while read line; do
            template_channel=$(echo "$line" | sed 's/,$//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$template_channel" ] && continue
            
            template_simple=$(tradition_to_simple "$template_channel")
            echo "匹配频道: $template_simple"
            
            best_url=""
            best_priority=99
            
            while IFS='|' read -r orig_channel simple_channel url priority; do
              if fuzzy_match "$template_simple" "$simple_channel"; then
                if [ $priority -lt $best_priority ]; then
                  best_priority=$priority
                  best_url=$url
                fi
              fi
            done < /tmp/url_map_raw.txt
            
            if [ -n "$best_url" ]; then
              echo "$template_channel,$best_url" >> /tmp/url_map.txt
              echo "  ✅ 匹配成功: $template_channel"
            else
              echo "  ❌ 匹配失败: $template_channel"
            fi
          done
          
          MATCH_COUNT=$(wc -l < /tmp/url_map.txt)
          echo "模糊匹配完成，共匹配 $MATCH_COUNT 个频道"
          
          # 读取模板并更新URL
          echo "开始更新 iptv.txt..."
          > iptv.txt.new
          
          while IFS= read -r line; do
            if echo "$line" | grep -q '#genre#$'; then
              echo "$line" >> iptv.txt.new
              continue
            fi
            
            if echo "$line" | grep -q '^[^#].\+,$'; then
              channel_name=$(echo "$line" | sed 's/,$//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              
              url=$(grep "^$channel_name," /tmp/url_map.txt | head -1 | cut -d',' -f2-)
              
              if [ -n "$url" ]; then
                echo "$channel_name,$url" >> iptv.txt.new
              else
                echo "$channel_name," >> iptv.txt.new
              fi
              continue
            fi
            
            echo "$line" >> iptv.txt.new
          done < iptv.txt
          
          NEW_LINES=$(wc -l < iptv.txt.new)
          if [ "$NEW_LINES" -lt 50 ]; then
            echo "❌ 错误: 生成文件行数过少 ($NEW_LINES)"
            exit 1
          fi
          
          mv iptv.txt.new iptv.txt
          echo "✅ 更新完成"

      - name: Commit and Push
        run: |
          if [ -f iptv.txt.bak ] && diff -q iptv.txt iptv.txt.bak > /dev/null; then
            echo "✅ 内容无变化，跳过提交"
            exit 0
          fi
          
          echo "🔄 检测到变化，准备提交"
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add iptv.txt
          git commit -m "Update IPTV URLs - $(date '+%Y-%m-%d %H:%M:%S')"
          
          git pull --rebase --strategy-option ours
          git push
          
          echo "✅ 已成功推送到仓库"
