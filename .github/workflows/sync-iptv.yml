name: Sync IPTV Source

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download IPTV
        run: |
          curl -L "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hubeiyidong" -o 000.txt
          curl -L "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hbyd" -o 000.txt
          curl -L "https://raw.giteeusercontent.com/zhanghuan12345/my-live/raw/master/hubeiyd" -o 000.txt

      - name: Commit and Push
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add 000.txt 000.m3u
          git commit -m "Update" || true
          git push
