name: Smart Sync TV Source (Hourly Check)

on:
  schedule:
    # 每小时的第0分钟运行一次，用于检测变化
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  check-delay-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check, Wait and Sync
        run: |
          # 定义文件路径
          SOURCE_URL="http://192168125.ddnsto.com:5000/tv.txt"
          TEMP_FILE="/tmp/latest_tv.txt"
          STAGING_FILE=".staging_tv.txt" # 暂存文件，用于等待10分钟
          CHANGE_FLAG=".pending_change" # 标记文件，记录检测到变化的时刻

          echo "1. 正在从源地址下载文件..."
          curl -sL "$SOURCE_URL" -o $TEMP_FILE

          # 如果本地尚无正式文件，则直接复制并提交（首次运行）
          if [ ! -f tv.txt ]; then
            echo "本地 tv.txt 不存在，正在首次创建并提交..."
            cp $TEMP_FILE tv.txt
            # Git 提交部分（复用下面会写的提交函数）
            COMMIT_AND_PUSH=true
          else
            # 比对内容是否变化
            if diff -q tv.txt $TEMP_FILE > /dev/null; then
              echo "2. 内容无变化。检查是否有待处理的延迟更新..."
              # 无变化时，检查是否有之前标记的、已到时间的待处理任务
              if [ -f "$CHANGE_FLAG" ]; then
                CHANGE_TIME=$(cat $CHANGE_FLAG)
                CURRENT_TIME=$(date +%s)
                if [ $((CURRENT_TIME - CHANGE_TIME)) -ge 600 ]; then
                  echo "3. 发现已到等待时间的延迟更新，使用暂存文件进行提交..."
                  if [ -f "$STAGING_FILE" ]; then
                    cp $STAGING_FILE tv.txt
                    COMMIT_AND_PUSH=true
                    rm -f $CHANGE_FLAG $STAGING_FILE # 清理标记和暂存文件
                  fi
                else
                  echo "3. 存在延迟更新，但等待时间尚未满足（还需等待 $((600 - (CURRENT_TIME - CHANGE_TIME))) 秒）。"
                fi
              else
                echo "3. 没有待处理的更新，流程结束。"
              fi
            else
              echo "2. 检测到内容变化！准备进入10分钟等待期..."
              # 保存新内容到暂存文件
              cp $TEMP_FILE $STAGING_FILE
              # 记录当前时间到标记文件
              date +%s > $CHANGE_FLAG
              echo "3. 已暂存新内容并记录时间戳。将在下次运行时检查是否到达10分钟提交窗口。"
              # 等待期间，为了保持仓库整洁，可以回滚 tv.txt 的任何潜在变化，但这里我们不修改 tv.txt
            fi
          fi

          # 统一的 Git 提交操作
          if [ "$COMMIT_AND_PUSH" = true ]; then
            echo "正在提交更新到 GitHub 仓库..."
            git config --local user.name "GitHub Action"
            git config --local user.email "action@github.com"
            git add tv.txt
            git commit -m "Update TV source at $(date)" || exit 0
            git pull --rebase --strategy-option ours
            git push
            echo "提交成功！"
          fi
