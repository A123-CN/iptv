name: Smart Sync TV Source

on:
  schedule:
    - cron: '0 * * * *'  # 每小时执行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Update TV Source
        run: |
          # 源地址（已验证可用）
          SOURCE_URL="http://192168125.ddnsto.com:5000/tv.txt"
          
          echo "=== 下载 TV 源文件 ==="
          echo "时间: $(date)"
          
          # 下载新文件（带重试）
          for i in 1 2 3; do
            if curl -L --fail --connect-timeout 10 --max-time 30 \
                "$SOURCE_URL" -o /tmp/tv_new.txt; then
              if [ -s /tmp/tv_new.txt ]; then
                echo "✅ 下载成功，文件大小: $(wc -c < /tmp/tv_new.txt) 字节"
                break
              fi
            fi
            echo "⚠ 下载失败，重试 $i/3..."
            sleep 2
          done
          
          # 检查下载是否成功
          if [ ! -s /tmp/tv_new.txt ]; then
            echo "❌ 错误：下载失败或文件为空"
            exit 1
          fi
          
          # 显示文件信息
          echo "新文件行数: $(wc -l < /tmp/tv_new.txt)"
          echo "新文件前5行:"
          head -5 /tmp/tv_new.txt
          
          # 检查是否有变化
          if [ -f tv.txt ]; then
            if diff -q tv.txt /tmp/tv_new.txt > /dev/null 2>&1; then
              echo "✅ 内容无变化，无需更新"
              exit 0
            else
              echo "🔄 检测到内容变化，准备更新"
              # 显示变化统计
              echo "变化详情:"
              diff tv.txt /tmp/tv_new.txt | head -20 || true
            fi
          else
            echo "📝 本地文件不存在，首次创建"
          fi
          
          # 更新文件
          cp /tmp/tv_new.txt tv.txt
          
          # 提交并推送
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add tv.txt
          git commit -m "Update TV source - $(date '+%Y-%m-%d %H:%M:%S')"
          git pull --rebase --strategy-option ours
          git push
          
          echo "✅ 已成功推送到仓库"
