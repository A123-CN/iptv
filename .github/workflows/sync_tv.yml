name: Smart Sync TV Source (Daily Force Update)

on:
  schedule:
    # 每天 UTC 时间 18:40 执行，对应北京时间次日凌晨 2:40
    - cron: '40 18 * * *'
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Download and Update TV Source
        run: |
          # 强制更新源地址 (注意：原地址协议疑似缺失，已按标准格式补充 https://)
          SOURCE_URL="https://192168125.ddnsto.com:443/tv.txt"
          
          echo "=== 强制下载 TV 源文件 (北京时间凌晨 2:40) ==="
          echo "时间: $(date)"
          
          # 下载新文件（带重试）
          for i in 1 2 3; do
            if curl -L --fail --connect-timeout 10 --max-time 30 \
                --insecure \  # 如果目标为自签名 https，可保留；若为 http 请删除此行
                "$SOURCE_URL" -o /tmp/tv_new.txt; then
              if [ -s /tmp/tv_new.txt ]; then
                echo "✅ 下载成功，文件大小: $(wc -c < /tmp/tv_new.txt) 字节"
                break
              fi
            fi
            echo "⚠ 下载失败，重试 $i/3..."
            sleep 2
            if [ $i -eq 3 ]; then
              echo "❌ 下载失败，流程终止"
              exit 1
            fi
          done
          
          # 显示文件信息
          echo "新文件行数: $(wc -l < /tmp/tv_new.txt)"
          echo "新文件前5行:"
          head -5 /tmp/tv_new.txt
          
          # 强制更新：直接覆盖本地文件
          cp /tmp/tv_new.txt tv.txt
          
          # 提交并强制推送（忽略内容变化检测）
          git config --local user.name "GitHub Action (Force Sync)"
          git config --local user.email "action+force@github.com"
          git add tv.txt
          # 即使无变化也允许提交（--allow-empty），并强制记录本次同步
          git commit --allow-empty -m "Force sync TV source at $(date '+%Y-%m-%d %H:%M:%S') (UTC)"
          git pull --rebase --strategy-option ours
          git push
          
          echo "✅ 强制更新及推送已完成"
