name: Smart Sync TV Source

on:
  schedule:
    # 每60分钟运行一次（修正语法）
    - cron: '0 * * * *'  # 每小时整点执行
  workflow_dispatch:  # 允许手动触发

jobs:
  check-delay-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check, Wait and Sync
        run: |
          # 定义文件路径
          SOURCE_URL="http://192168125.ddnsto.com:5000/tv.txt"
          TEMP_FILE="/tmp/latest_tv.txt"
          STAGING_FILE=".staging_tv.txt"
          CHANGE_FLAG=".pending_change"
          
          echo "=== 开始执行 TV 源同步任务 ==="
          echo "当前时间: $(date)"
          
          # 测试网络连通性
          echo "1. 测试源地址连通性..."
          if ! curl -sL --connect-timeout 10 "$SOURCE_URL" -o $TEMP_FILE; then
            echo "错误：无法访问源地址 $SOURCE_URL"
            echo "请检查该地址是否可从 GitHub Actions 环境访问"
            exit 1
          fi
          
          # 检查下载文件是否为空
          if [ ! -s $TEMP_FILE ]; then
            echo "错误：下载的文件为空"
            exit 1
          fi
          
          echo "2. 文件下载成功，大小: $(wc -c < $TEMP_FILE) 字节"
          
          # 如果本地尚无正式文件，直接创建并提交
          if [ ! -f tv.txt ]; then
            echo "3. 本地 tv.txt 不存在，首次创建..."
            cp $TEMP_FILE tv.txt
            COMMIT_AND_PUSH=true
          else
            # 比对内容是否变化
            if diff -q tv.txt $TEMP_FILE > /dev/null; then
              echo "3. 内容无变化。检查是否有待处理的延迟更新..."
              if [ -f "$CHANGE_FLAG" ]; then
                CHANGE_TIME=$(cat $CHANGE_FLAG)
                CURRENT_TIME=$(date +%s)
                TIME_DIFF=$((CURRENT_TIME - CHANGE_TIME))
                echo "   距离上次检测到变化: ${TIME_DIFF} 秒"
                if [ $TIME_DIFF -ge 600 ]; then
                  echo "4. 等待时间已满足，执行更新..."
                  if [ -f "$STAGING_FILE" ]; then
                    cp $STAGING_FILE tv.txt
                    COMMIT_AND_PUSH=true
                    rm -f $CHANGE_FLAG $STAGING_FILE
                  fi
                else
                  echo "4. 还需等待 $((600 - TIME_DIFF)) 秒"
                fi
              else
                echo "4. 没有待处理的更新"
              fi
            else
              echo "3. 检测到内容变化！进入等待期..."
              cp $TEMP_FILE $STAGING_FILE
              date +%s > $CHANGE_FLAG
              echo "4. 新内容已暂存，将在10分钟后提交"
            fi
          fi
          
          # Git 提交操作
          if [ "$COMMIT_AND_PUSH" = true ]; then
            echo "=== 提交更改到 GitHub ==="
            git config --local user.name "GitHub Action"
            git config --local user.email "action@github.com"
            git add tv.txt
            if git diff --cached --quiet; then
              echo "没有需要提交的更改"
            else
              git commit -m "Update TV source at $(date)"
              git pull --rebase --strategy-option ours
              git push
              echo "提交成功！"
            fi
          else
            echo "=== 本次无需提交 ==="
          fi
