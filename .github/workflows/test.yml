name: Sync IPTV Source

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Read
        run: |
          echo "=== 文件内容 ==="
          cat iptv.txt | head -10
          
          echo ""
          echo "=== 测试 grep 匹配 ==="
          echo "匹配 ',$' 的行数:"
          grep ',$' iptv.txt | wc -l
          
          echo ""
          echo "匹配 ', *$' 的行数:"
          grep ', *$' iptv.txt | wc -l
          
          echo ""
          echo "匹配 ',,' 的行数:"
          grep ',,' iptv.txt | wc -l
          
          echo ""
          echo "=== 使用 sed 提取 ==="
          sed -n '/^[^#].*,/p' iptv.txt | head -10
