name: Simple Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: |
          echo "=== 列出所有文件 ==="
          ls -la
          
          echo ""
          echo "=== 查看 iptv.txt 是否存在 ==="
          if [ -f iptv.txt ]; then
            echo "文件存在"
            echo "=== 文件内容 ==="
            cat iptv.txt | head -10
          else
            echo "文件不存在！"
            echo "当前目录内容："
            ls -la
          fi
