name: Sync IPTV Source

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update IPTV URLs
        run: |
          echo "=== 开始更新 IPTV 源 ==="
          echo "时间: $(date)"
          
          sed -i 's/\r$//' iptv.txt
          
          # 下载源
          curl -L --connect-timeout 30 --max-time 60 \
            "https://raw.githubusercontent.com/CCSH/IPTV/refs/heads/main/live_lite.txt" \
            -o /tmp/source.txt 2>/dev/null
          
          echo "=== 源文件前20行 ==="
          head -20 /tmp/source.txt
          
          echo ""
          echo "=== 源文件中包含 CCTV 的行 ==="
          grep -i "cctv" /tmp/source.txt | head -10
